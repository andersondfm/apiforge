services:
  mysql:
    image: mysql:8.4
    container_name: apiforge-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    volumes:
      - apiforge_mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-udemo', '-pdemo']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  apiforge_mysql_data:
