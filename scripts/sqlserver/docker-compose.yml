services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apiforge-mssql
    restart: unless-stopped
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Your_strong_Password123'
    volumes:
      - apiforge_mssql_data:/var/opt/mssql
      - ./init:/init:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Your_strong_Password123" -Q "SELECT 1" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  apiforge_mssql_data:
