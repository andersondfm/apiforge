services:
  postgres:
    image: postgres:16
    container_name: apiforge-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - apiforge_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d demo']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  apiforge_postgres_data:
