name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Ensure databases
        run: npm run ensure:dbs

      - name: E2E generate + CRUD
        run: npm run test:e2e
        env:
          E2E_KEEP: '1'
          E2E_WORK_DIR: ${{ github.workspace }}/.e2e-work

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            ${{ github.workspace }}/.e2e-work/report.json
            ${{ github.workspace }}/scripts/e2e/last-report.json
          if-no-files-found: ignore
